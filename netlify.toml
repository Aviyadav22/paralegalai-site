[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  PRISMA_CLI_BINARY_TARGETS = "debian-openssl-3.0.x"
  SECRETS_SCAN_OMIT_KEYS = "NEXTAUTH_URL,NEXTAUTH_SECRET,DATABASE_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,RESEND_API_KEY,RESEND_FROM,CONTACT_RECEIVER,SHARED_JWT_SECRET"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true
